<style>
:root{color-scheme:light;--ink:#1d1d1f;--sub:#6b7280;--line:#e8e8ec;--accent:#d9480f;--nv:#03c75a;--chip:#f3f4f6}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:22px;margin:0;letter-spacing:-.4px}

nav::-webkit-scrollbar{display:none}
nav a{flex:none;text-decoration:none;color:var(--ink);background:var(--chip);border-radius:99px;padding:5px 11px;font-size:13px;white-space:nowrap}
section{scroll-margin-top:56px}
h2{font-size:17px;margin:22px 0 0}

.card{border-bottom:1px solid var(--line);padding:13px 0}
.nm{font-weight:700;font-size:16.5px}
.rk{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;margin-right:7px;border-radius:99px;background:var(--ink);color:#fff;font-size:12.5px;font-weight:700;vertical-align:2px}
.ar{font-size:12px;font-weight:400;color:var(--sub);margin-left:4px}
.rs{color:var(--accent);font-weight:600;font-size:14px}
.t{font-size:13.5px;color:#3f3f46;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.t.open{display:block}
.row{font-size:13.5px;margin-top:4px;display:flex;gap:6px}
.row .k{color:var(--sub);flex:none;width:30px}
.row .no{color:var(--sub)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btns a{display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px;background:#fff}
.btns a.tel{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btns a.tel small{font-weight:400;opacity:.85}
.btns a.nb{border:1.5px solid var(--nv)}
.btns a.ig{border:1.5px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5) border-box}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
#dlg[hidden]{display:none}
#dlg .box{background:#fff;border-radius:16px;padding:20px 18px 16px;width:100%;max-width:340px;text-align:center}
#dlg .q{font-size:16px;line-height:1.45}
#dlg .no{font-size:22px;font-weight:700;margin:10px 0 16px;letter-spacing:.3px;user-select:all}
#dlg .row2{display:flex;gap:8px}
#dlg .row2>*{flex:1;border-radius:11px;padding:12px 0;font:inherit;font-size:15px;font-weight:700;text-decoration:none;border:1px solid var(--line);background:#fff;color:var(--ink)}
#dlg #dlgGo{background:var(--accent);border-color:var(--accent);color:#fff}
#dlg .cp{margin-top:10px;width:100%;border:0;background:none;color:var(--sub);font:inherit;font-size:13.5px;padding:6px}

function __render(G){

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let _rk=0;G.forEach(g=>g.items.forEach(r=>r.rk=++_rk));
document.getElementById("nav").innerHTML=G.map((g,i)=>`<a href="#g${i}">${esc(g.g)} ${g.items.length}</a>`).join("");
document.getElementById("list").innerHTML=G.map((g,i)=>`<section id="g${i}"><h2>${esc(g.g)}<span class="c">${g.items.length}곳</span></h2>`+
 g.items.map(r=>`<div class="card">
  <div class="nm"><span class="rk">${r.rk}</span>${esc(r.n)} <span class="ar">${esc(r.g)}</span></div>
  ${r.rs?`<div class="rs">${esc(r.rs)}</div>`:""}
  ${r.t?`<div class="t">${esc(r.t)}</div>`:""}
  <div class="row"><span class="k">영업</span>${r.hr?`<span>${esc(r.hr)}</span>`:`<span class="no">정보 없음</span>`}</div>
  <div class="row"><span class="k">주소</span><span>${esc(r.a)}</span></div>
  <div class="btns">
   ${r.ph.length?r.ph.map(([p,l])=>`<a class="tel" href="tel:${esc(p.replace(/[^0-9+]/g,""))}" data-tel="${esc(p)}" data-nm="${esc(r.n)}">📞 ${esc(p)}${l?` <small>${esc(l)}</small>`:""}</a>`).join(""):""}
   ${r.nv?`<a href="${esc(r.nv)}" target="_blank" rel="noopener">네이버지도</a>`:""}
   ${r.L.map(([u,l])=>`<a class="nb" href="${esc(u)}" target="_blank" rel="noopener">${esc(l)}</a>`).join("")}
   ${r.ig?`<a class="ig" href="${esc(r.ig)}" target="_blank" rel="noopener">인스타 릴스</a>`:""}
  </div></div>`).join("")+`</section>`).join("");
const dlg=document.getElementById("dlg");
document.getElementById("list").addEventListener("click",e=>{
  const a=e.target.closest("a.tel"); if(a&&false){e.preventDefault();
    document.getElementById("dlgNm").textContent=a.dataset.nm;
    document.getElementById("dlgNo").textContent=a.dataset.tel;
    const go=document.getElementById("dlgGo"); go.href="tel:"+a.dataset.tel.replace(/[^0-9+]/g,"");
    document.getElementById("dlgCp").textContent="번호 복사";
    dlg.hidden=false; return;}
const t=e.target.closest(".t");if(t)t.classList.toggle("open");});
document.getElementById("dlgNo2").onclick=()=>{dlg.hidden=true;};
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.hidden=true;});
document.getElementById("dlgCp").onclick=async()=>{const n=document.getElementById("dlgNo").textContent,b=document.getElementById("dlgCp");
  try{await navigator.clipboard.writeText(n);b.textContent="복사됨 ✓";}catch(_){const r=document.createRange();r.selectNodeContents(document.getElementById("dlgNo"));const s=getSelection();s.removeAllRanges();s.addRange(r);try{document.execCommand("copy");b.textContent="복사됨 ✓";}catch(__){b.textContent="번호를 길게 눌러 복사";}}};

}
(function(){
  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  async function open(pw){
    const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(__BLOB.s),iterations:__BLOB.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(__BLOB.i)},k,b64(__BLOB.c));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  async function tryPw(pw,quiet){
    try{const G=await open(pw);try{localStorage.setItem("hm-site-pw",pw)}catch(e){}document.getElementById("lock").remove();__render(G);return true;}
    catch(e){if(!quiet)document.getElementById("lockerr").textContent="비밀번호가 맞지 않아요.";return false;}
  }
  let saved=null;try{saved=localStorage.getItem("hm-site-pw")}catch(e){}
  const hk=(location.hash.match(/[#&]k=([^&]+)/)||[])[1];
  (async()=>{
    if(hk&&await tryPw(decodeURIComponent(hk),true))return;
    if(saved&&await tryPw(saved,true))return;
    document.getElementById("lockpw").focus();
  })();
  document.getElementById("lockf").onsubmit=e=>{e.preventDefault();document.getElementById("lockerr").textContent="여는 중…";tryPw(document.getElementById("lockpw").value.trim());};
})();
</script></body></html>
