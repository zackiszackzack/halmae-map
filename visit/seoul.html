<style>#lock{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#f4f5f7;font-family:'Noto Sans KR',system-ui,sans-serif;padding:16px}#lock form{background:#fff;border:1px solid #e4e6ea;border-radius:14px;padding:22px 20px;width:100%;max-width:340px;box-shadow:0 6px 24px rgba(0,0,0,.08)}#lock h1{font-size:18px;margin:0 0 6px;color:#1e1e23}#lock p{font-size:13px;color:#8a8d93;margin:0 0 14px;line-height:1.5}#lock input{width:100%;box-sizing:border-box;font-size:16px;padding:11px 12px;border:1px solid #d3d6db;border-radius:10px}#lock button{margin-top:10px;width:100%;font-size:16px;padding:11px;border:0;border-radius:10px;background:#03c75a;color:#fff;font-weight:700}#lock .err{color:#d93025;font-size:13px;min-height:18px;margin-top:8px}@media (prefers-color-scheme:dark){#lock{background:#16171b}#lock form{background:#1f2026;border-color:#33353c}#lock h1{color:#eee}#lock input{background:#16171b;color:#eee;border-color:#3a3c44}}</style>
<style>
:root{color-scheme:light;--ink:#1d1d1f;--sub:#6b7280;--line:#e8e8ec;--accent:#d9480f;--nv:#03c75a;--chip:#f3f4f6}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:22px;margin:0 0 10px;letter-spacing:-.4px}
.bar{position:sticky;top:0;z-index:3;background:rgba(255,255,255,.96);padding:8px 0 10px;border-bottom:1px solid var(--line)}
select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);width:100%}
details.c{border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
details.c>summary{list-style:none;cursor:pointer;padding:12px 14px}
details.c>summary::-webkit-details-marker{display:none}
.ct{font-weight:700;font-size:16px;display:flex;align-items:baseline;gap:8px}
.ct .no{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 7px;border-radius:99px;background:var(--ink);color:#fff;font-size:13px}
.cm{font-size:13px;color:var(--sub);margin-top:2px}
.cm b{color:var(--accent);font-weight:600}
.shops{border-top:1px solid var(--line);padding:0 14px}
.card{border-bottom:1px solid var(--line);padding:12px 0}
.card:last-child{border-bottom:0}
.step{font-size:12px;color:var(--sub);margin-bottom:2px}
.nm{font-weight:700;font-size:16px}
.nm .k{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:99px;background:#eef0f3;font-size:12px;margin-right:6px;vertical-align:2px}
.star{font-size:11.5px;font-weight:700;color:#fff;background:var(--accent);border-radius:99px;padding:1px 8px;margin-left:4px;vertical-align:2px}
.rs{color:var(--accent);font-weight:600;font-size:14px}
.t{font-size:13.5px;color:#3f3f46;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.t.open{display:block}
.row{font-size:13.5px;margin-top:4px;display:flex;gap:6px}
.row .k2{color:var(--sub);flex:none;width:30px}
.row .no2{color:var(--sub)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btns a{display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px;background:#fff}
.btns a.go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btns a.nb{border:1.5px solid var(--nv)}
.btns a.ig{border:1.5px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5) border-box}
</style></head><body>

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(C){
  const gus=[...new Set(C.map(c=>c.area.split(" ").slice(0,2).join(" ")))].sort();
  const sel=document.getElementById("sel"); sel.innerHTML+=gus.map(g=>`<option>${esc(g)}</option>`).join("");
  const list=document.getElementById("list");
  const draw=()=>{const f=sel.value;
    list.innerHTML=C.map((c,i)=>({c,i})).filter(({c})=>!f||c.area.startsWith(f)).map(({c,i})=>`<details class="c"><summary>
      <div class="ct"><span class="no">${i+1}</span>${esc(c.area)}</div>
      <div class="cm">${c.items.length}곳${c.rec?` · <b>섭외추천 ${c.rec}</b>`:""} · 동선 ${c.km}km${c.off?` · ${esc(c.off.split("").join("·"))}요일 휴무 많음`:""}</div></summary>
      <div class="shops">${c.items.map((r,j)=>`<div class="card">
        ${j?`<div class="step">↓ 다음 가게까지 ${r.step}km</div>`:""}
        <div class="nm"><span class="k">${j+1}</span>${esc(r.n)}${r.rec?'<span class="star">섭외추천</span>':""}</div>
        ${r.rs?`<div class="rs">${esc(r.rs)}</div>`:""}
        ${r.t?`<div class="t">${esc(r.t)}</div>`:""}
        <div class="row"><span class="k2">영업</span>${r.hr?`<span>${esc(r.hr)}</span>`:`<span class="no2">정보 없음</span>`}</div>
        <div class="row"><span class="k2">주소</span><span>${esc(r.a)}</span></div>
        <div class="btns">
          <a class="go" href="https://map.kakao.com/link/to/${encodeURIComponent(r.n)},${r.lat},${r.lng}" target="_blank" rel="noopener">길찾기</a>
          ${r.nv?`<a href="${esc(r.nv)}" target="_blank" rel="noopener">네이버지도</a>`:""}
          ${r.L.map(([u,l])=>`<a class="nb" href="${esc(u)}" target="_blank" rel="noopener">${esc(l)}</a>`).join("")}
          ${r.ig?`<a class="ig" href="${esc(r.ig)}" target="_blank" rel="noopener">인스타 릴스</a>`:""}
          ${r.p?`<a href="tel:${esc(r.p.replace(/[^0-9+]/g,""))}">📞 ${esc(r.p)}</a>`:""}
        </div></div>`).join("")}</div></details>`).join("");};
  sel.onchange=draw; draw();
  list.addEventListener("click",e=>{const t=e.target.closest(".t");if(t)t.classList.toggle("open");});
}
(function(){
  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  async function open(pw){const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(__BLOB.s),iterations:__BLOB.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(__BLOB.i)},k,b64(__BLOB.c))));}
  async function tryPw(pw,quiet){try{const C=await open(pw);try{localStorage.setItem("hm-site-pw",pw)}catch(e){}document.getElementById("lock").remove();render(C);return true;}
    catch(e){if(!quiet)document.getElementById("lockerr").textContent="비밀번호가 맞지 않아요.";return false;}}
  let saved=null;try{saved=localStorage.getItem("hm-site-pw")}catch(e){}
  const hk=(location.hash.match(/[#&]k=([^&]+)/)||[])[1];
  (async()=>{if(hk&&await tryPw(decodeURIComponent(hk),true))return;if(saved&&await tryPw(saved,true))return;document.getElementById("lockpw").focus();})();
  document.getElementById("lockf").onsubmit=e=>{e.preventDefault();document.getElementById("lockerr").textContent="여는 중…";tryPw(document.getElementById("lockpw").value.trim());};
})();
</script></body></html>
